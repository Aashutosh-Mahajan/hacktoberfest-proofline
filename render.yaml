services:
  - type: web
    name: proofline-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn mayday.api.app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: MAYDAY_ALLOWED_ORIGINS
        value: https://frontend-zeta-olive-60.vercel.app
      - key: MAYDAY_MODEL_URL
        sync: false
      - key: MAYDAY_MODEL_NAME
        value: gemma4:e4b
      - key: MAYDAY_RUNS_DIR
        value: /tmp/proofline-runs
